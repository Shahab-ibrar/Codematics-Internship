<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Manager Pro - Members</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        primary: '#6366f1',
                        primaryDark: '#4f46e5',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-darkBg text-slate-800 dark:text-slate-200 transition-colors duration-300 antialiased min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-white dark:bg-darkCard shadow-xl h-screen sticky top-0 flex flex-col transition-colors duration-300 z-10 hidden md:flex">
        <div class="h-20 flex items-center justify-center border-b border-slate-200 dark:border-slate-700">
            <h1 class="text-2xl font-bold text-primary flex items-center gap-2">
                <i class="fa-solid fa-book-open-reader"></i> LibManager
            </h1>
        </div>
        <nav class="flex-1 px-4 py-8 space-y-2">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-primary rounded-xl transition-all font-medium">
                <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
            </a>
            <a href="books.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-primary rounded-xl transition-all font-medium">
                <i class="fa-solid fa-book w-5"></i> Books
            </a>
            <a href="members.html" class="flex items-center gap-3 px-4 py-3 bg-primary text-white rounded-xl shadow-lg shadow-primary/30 transition-all font-semibold">
                <i class="fa-solid fa-users w-5"></i> Members
            </a>
            <a href="issue_return.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-primary rounded-xl transition-all font-medium">
                <i class="fa-solid fa-hand-holding-hand w-5"></i> Issue / Return
            </a>

            <div class="pt-8 mb-4">
                <hr class="border-slate-200 dark:border-slate-700 mb-4">
                <a href="#" id="logoutBtn" class="flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-xl transition-all font-medium">
                    <i class="fa-solid fa-sign-out-alt w-5"></i> Logout
                </a>
            </div>
        </nav>
        <div class="p-4 border-t border-slate-200 dark:border-slate-700">
            <button id="themeToggle" class="w-full flex items-center justify-center gap-2 px-4 py-3 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:inline text-yellow-500"></i>
                <span class="dark:hidden">Dark Mode</span>
                <span class="hidden dark:inline">Light Mode</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="h-20 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md sticky top-0 z-10 px-8 flex items-center justify-between border-b border-slate-200 dark:border-slate-700 shadow-sm">
            <h2 class="text-2xl font-bold">Member Management</h2>
            <div class="flex items-center gap-4">
                <span id="headerUserName" class="hidden sm:inline font-medium text-slate-600 dark:text-slate-300">Admin</span>
                <div class="relative">
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=6366f1&color=fff" class="w-10 h-10 rounded-full shadow-md" alt="Admin">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-darkCard rounded-full"></div>
                </div>
            </div>
        </header>

        <div class="p-8 flex-1 flex flex-col max-w-7xl mx-auto w-full">
            
            <div class="flex flex-col md:flex-row justify-between flex-wrap gap-4 mb-8">
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-search absolute left-4 top-3.5 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Search members by name, ID, or dept..." 
                           class="w-full pl-10 pr-4 py-3 rounded-xl bg-white dark:bg-darkCard border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary shadow-sm text-slate-700 dark:text-slate-200 transition-all">
                </div>
                
                <button onclick="openAddModal()" class="bg-primary hover:bg-primaryDark text-white px-6 py-3 rounded-xl font-semibold shadow-lg shadow-primary/30 flex items-center gap-2 transition-all hover:-translate-y-0.5">
                    <i class="fa-solid fa-user-plus"></i> Add New Member
                </button>
            </div>

            <div class="bg-white dark:bg-darkCard rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-700 overflow-hidden glass-card flex-1">
                <div class="overflow-x-auto h-full">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 text-sm py-4 uppercase tracking-wider">
                                <th class="p-4 font-medium">Member ID</th>
                                <th class="p-4 font-medium">Name</th>
                                <th class="p-4 font-medium">Department</th>
                                <th class="p-4 font-medium">Contact</th>
                                <th class="p-4 font-medium">Issued Books</th>
                                <th class="p-4 font-medium text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="membersTableBody" class="divide-y divide-slate-100 dark:divide-slate-700/50">
                            <tr><td colspan="6" class="p-8 text-center text-slate-500"><i class="fa-solid fa-circle-notch fa-spin text-primary text-2xl mb-2"></i><br>Loading members...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Background -->
    <div id="memberModalOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <!-- Modal Content -->
        <div id="memberModal" class="bg-white dark:bg-darkCard rounded-2xl w-full max-w-md shadow-2xl transform scale-95 transition-all duration-300 overflow-hidden">
            <div class="p-6 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                <h3 class="text-xl font-bold" id="modalTitle">Add New Member</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>
            <form id="memberForm" class="p-6 space-y-4">
                <input type="hidden" id="formMode" value="add">
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Member ID</label>
                    <input type="text" id="memberId" required placeholder="e.g. M001"
                           class="w-full px-4 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100 transition-all">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Full Name</label>
                    <input type="text" id="memberName" required placeholder="John Doe"
                           class="w-full px-4 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100 transition-all">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Department</label>
                    <input type="text" id="memberDept" required placeholder="Computer Science"
                           class="w-full px-4 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100 transition-all">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Contact Info</label>
                    <input type="text" id="memberContact" required placeholder="john@example.com"
                           class="w-full px-4 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100 transition-all">
                </div>

                <div class="pt-4 flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium transition-colors">Cancel</button>
                    <button type="submit" class="bg-primary hover:bg-primaryDark text-white px-5 py-2.5 rounded-xl font-medium shadow-md transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-save"></i> Save Member
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/members.js"></script>
</body>
</html>
