<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Manager Pro - Issue & Return</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        primary: '#6366f1',
                        primaryDark: '#4f46e5',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-darkBg text-slate-800 dark:text-slate-200 transition-colors duration-300 antialiased min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-white dark:bg-darkCard shadow-xl h-screen sticky top-0 flex flex-col transition-colors duration-300 z-10 hidden md:flex">
        <div class="h-20 flex items-center justify-center border-b border-slate-200 dark:border-slate-700">
            <h1 class="text-2xl font-bold text-primary flex items-center gap-2">
                <i class="fa-solid fa-book-open-reader"></i> LibManager
            </h1>
        </div>
        <nav class="flex-1 px-4 py-8 space-y-2">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-primary rounded-xl transition-all font-medium">
                <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
            </a>
            <a href="books.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-primary rounded-xl transition-all font-medium">
                <i class="fa-solid fa-book w-5"></i> Books
            </a>
            <a href="members.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-primary rounded-xl transition-all font-medium">
                <i class="fa-solid fa-users w-5"></i> Members
            </a>
            <a href="issue_return.html" class="flex items-center gap-3 px-4 py-3 bg-primary text-white rounded-xl shadow-lg shadow-primary/30 transition-all font-semibold">
                <i class="fa-solid fa-hand-holding-hand w-5"></i> Issue / Return
            </a>

            <div class="pt-8 mb-4">
                <hr class="border-slate-200 dark:border-slate-700 mb-4">
                <a href="#" id="logoutBtn" class="flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-xl transition-all font-medium">
                    <i class="fa-solid fa-sign-out-alt w-5"></i> Logout
                </a>
            </div>
        </nav>
        <div class="p-4 border-t border-slate-200 dark:border-slate-700">
            <button id="themeToggle" class="w-full flex items-center justify-center gap-2 px-4 py-3 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                <i class="fa-solid fa-moon dark:hidden"></i>
                <i class="fa-solid fa-sun hidden dark:inline text-yellow-500"></i>
                <span class="dark:hidden">Dark Mode</span>
                <span class="hidden dark:inline">Light Mode</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="h-20 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md sticky top-0 z-10 px-8 flex items-center justify-between border-b border-slate-200 dark:border-slate-700 shadow-sm">
            <h2 class="text-2xl font-bold">Issue & Return Books</h2>
            <div class="flex items-center gap-4">
                <span id="headerUserName" class="hidden sm:inline font-medium text-slate-600 dark:text-slate-300">Admin</span>
                <div class="relative">
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=6366f1&color=fff" class="w-10 h-10 rounded-full shadow-md" alt="Admin">
                    <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white dark:border-darkCard rounded-full"></div>
                </div>
            </div>
        </header>

        <div class="p-8 flex-1 flex flex-col max-w-7xl mx-auto w-full gap-8">
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Issue Form -->
                <div class="bg-white dark:bg-darkCard rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-700 p-8 glass-card">
                    <h3 class="text-xl font-bold mb-6 flex items-center gap-2 text-primary">
                        <i class="fa-solid fa-hand-holding"></i> Issue a Book
                    </h3>
                    <form id="issueForm" class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Book Selection</label>
                            <select id="issueBookSelect" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100 transition-all">
                                <option value="">Loading books...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Member Selection</label>
                            <select id="issueMemberSelect" required class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100 transition-all">
                                <option value="">Loading members...</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-primary hover:bg-primaryDark text-white py-3 rounded-xl font-bold shadow-lg shadow-primary/30 transition-all hover:-translate-y-0.5 mt-2">
                            Issue Book
                        </button>
                    </form>
                </div>

                <!-- Return Form -->
                <div class="bg-white dark:bg-darkCard rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-700 p-8 glass-card border-t-4 border-t-emerald-500">
                    <h3 class="text-xl font-bold mb-6 flex items-center gap-2 text-emerald-500">
                        <i class="fa-solid fa-hand-holding-hand"></i> Return a Book
                    </h3>
                    <form id="returnForm" class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Enter Transaction ID</label>
                            <input type="text" id="returnTransactionId" required placeholder="e.g. TXN-12345"
                                   class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-900 dark:text-slate-100 transition-all">
                        </div>
                        <div class="pt-6">
                            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-emerald-500/30 transition-all hover:-translate-y-0.5 mt-2">
                                Process Return
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Transactions History -->
            <div class="bg-white dark:bg-darkCard rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-700 overflow-hidden glass-card flex-1">
                <div class="p-6 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                    <h3 class="text-lg font-bold">Transaction History</h3>
                    <div class="relative w-64">
                        <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                        <input type="text" id="searchTxInput" placeholder="Search transactions..." 
                               class="w-full pl-9 pr-4 py-2 text-sm rounded-lg bg-white dark:bg-darkCard border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary shadow-sm text-slate-700 dark:text-slate-200 transition-all">
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 dark:bg-slate-800/50 text-slate-500 dark:text-slate-400 text-sm py-4 uppercase tracking-wider">
                                <th class="p-4 font-medium">Tx ID</th>
                                <th class="p-4 font-medium text-center">Type</th>
                                <th class="p-4 font-medium">Book ID</th>
                                <th class="p-4 font-medium">Member ID</th>
                                <th class="p-4 font-medium">Date Issued</th>
                                <th class="p-4 font-medium">Date Returned</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsTableBody" class="divide-y divide-slate-100 dark:divide-slate-700/50">
                            <tr><td colspan="6" class="p-8 text-center text-slate-500"><i class="fa-solid fa-circle-notch fa-spin text-primary text-2xl mb-2"></i><br>Loading transactions...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/transactions.js"></script>
</body>
</html>
