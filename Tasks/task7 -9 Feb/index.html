<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Practice Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- TASK 1 -->
  <section>
    <h2>1️ Age to Days Converter</h2>
    <input type="date" id="dob">
    <button onclick="ageToDays()">Convert</button>
    <p id="ageResult"></p>
  </section>

  <!-- TASK 2 -->
  <section>
    <h2>2️ Hours to Seconds</h2>
    <input type="number" id="hours" placeholder="Enter hours">
    <button onclick="hoursToSeconds()">Convert</button>
    <p id="hoursResult"></p>
  </section>

  <!-- TASK 3 -->
  <section>
    <h2>3️ Find Next Number</h2>
    <p>Array: [10, 20, 30, 40, 50]</p>
    <input type="number" id="arrayInput" placeholder="Array number">
    <button onclick="findNextInArray()">Find Next (Array)</button>

    <input type="number" step="any" id="singleInput" placeholder="Integer or Float">
    <button onclick="findNextSingle()">Find Next (Single)</button>

    <p id="nextResult"></p>
  </section>

  <!-- TASK 4 -->
  <section>
    <h2>4️ Capitalize Name</h2>
    <input type="text" id="nameInput" placeholder="enter name in lowercase">
    <button onclick="capitalizeName()">Convert</button>
    <p id="nameResult"></p>
  </section>

  <!-- TASK 5 -->
  <section>
    <h2>5️ BMI Calculator</h2>
    <input type="number" id="weight" placeholder="Weight (kg)">
    <input type="number" id="height" placeholder="Height (meters)">
    <button onclick="calculateBMI()">Calculate</button>
    <p id="bmiResult"></p>
  </section>

  <!-- TASK 6 -->
  <section>
    <h2>6️ Random Array Generator</h2>
    <button onclick="generateArray()">Generate Array</button>
    <p id="array"></p>
    <p id="first"></p>
    <p id="last"></p>
  </section>

  <!-- TASK 7 -->
  <section>
    <h2>7️ Textbox Addition (Event Handling)</h2>
    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number">
    <input type="text" id="sum" placeholder="Result" readonly>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
